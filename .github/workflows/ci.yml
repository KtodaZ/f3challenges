name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The Firestore emulator is a Java process. Ubuntu runners ship a JDK, but
      # pin it — the emulator needs 21+ and fails with an unhelpful error on 17.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Both emulator suites in one emulator, because booting it twice costs
      # more than the suites do.
      #
      # Rules: guards the rules that gate admin-only user fields. Without this
      # the suite is opt-in and rots — and a mistake here breaks writes for
      # every live PAX, which is the worst failure this repo has.
      #
      # API: exercises the admin routes end to end. The panel once shipped
      # 403ing every region admin on every list endpoint with typecheck, lint,
      # the unit suite and the build all green — nothing covered the wiring
      # between the auth helpers and the routes calling them. See TECH_DEBT #4.
      - name: Emulator tests (rules + admin API)
        run: pnpm test:emulator

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder

      - name: Install functions dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile

      - name: Typecheck (functions)
        working-directory: functions
        run: npx tsc --noEmit
